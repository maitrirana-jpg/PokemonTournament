<div class="card h-100 shadow-sm">
  <div class="card-body">

  
    <div class="d-flex justify-content-between align-items-start flex-wrap">

      <div class="card-heading mb-2">
        @if (rank) {
          <span class="rank-chip me-1" [attr.aria-label]="'Rank ' + rank">#{{ rank }}</span>
        }
        <span class="badge rounded-pill mb-2 {{ typeBadgeClass }}">
          {{ pokemon.type }}
        </span>
        @if (lastResult) {
          <span class="result-chip result-{{ lastResult }} ms-1"
                [attr.title]="resultLabels[lastResult] + ' this round'">{{ lastResult }}</span>
        }

        <h5 class="card-title text-capitalize mb-0">
          {{ pokemon.name }}
        </h5>

        <small class="text-muted">
          #{{ pokemon.id.toString().padStart(3, '0') }}
        </small>
      </div>

      <img
        [src]="Url"
        [alt]="pokemon.name"
        class="img-fluid"
        style="width: 64px; height: 64px;"
      />
    </div>

   
    <div class="row text-center g-2 mt-2">
      <div class="col-4">
        <div class="bg-light rounded p-2">
          <div class="text-muted small">Wins</div>
          <div class="fw-bold text-success">{{ pokemon.wins }}</div>
        </div>
      </div>

      <div class="col-4">
        <div class="bg-light rounded p-2">
          <div class="text-muted small">Losses</div>
          <div class="fw-bold text-danger">{{ pokemon.losses }}</div>
        </div>
      </div>

      <div class="col-4">
        <div class="bg-light rounded p-2">
          <div class="text-muted small">Ties</div>
          <div class="fw-bold text-primary">{{ pokemon.ties }}</div>
        </div>
      </div>
    </div>

    
    <div class="mt-3">
      <div class="d-flex justify-content-between small text-muted">
        <span>Win rate</span>
        <span>{{ winRate }}%</span>
      </div>

      <div class="progress" role="progressbar">
        <div
          class="progress-bar bg-success"
          [style.width.%]="winRate"
        ></div>
      </div>
    </div>

  </div>
</div>
